name: Excavator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Excavator
        uses: ScoopInstaller/GithubActions@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
